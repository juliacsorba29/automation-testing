name: Notify Jira on docs changes

on:
  push:
    paths:
      - 'integration/**'      # Only trigger when files in integration/ change
      - 'src/config/**' # (Optional) another folder

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Jira webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"text":"Files in docs or src/config changed on branch ${{ github.ref }}"}' \
            ${{ secrets.JIRA_WEBHOOK_URL }}
